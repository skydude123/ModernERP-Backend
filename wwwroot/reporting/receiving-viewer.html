<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Receiving Report</title>
    <link
      rel="stylesheet"
      href="https://kendo.cdn.telerik.com/themes/12.3.0/default/default-ocean-blue.css"
    />
    <style>
      html,
      body,
      #reportViewer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        overflow: hidden;
        background: #fff;
        font-family: Arial, sans-serif;
      }

      #reportViewer {
        position: absolute;
        inset: 0;
      }

      .viewer-message {
        box-sizing: border-box;
        width: 100%;
        padding: 24px;
        color: #334155;
      }

      .viewer-message h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }

      .viewer-message p {
        margin: 0 0 6px;
        font-size: 14px;
        line-height: 1.5;
      }

      .viewer-message code {
        display: block;
        margin-top: 12px;
        padding: 10px;
        overflow-wrap: anywhere;
        color: #991b1b;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 5px;
      }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>
  <body>
    <div id="reportViewer">
      <div class="viewer-message">
        <h1>Loading Receiving Report...</h1>
        <p>Please wait while the report is prepared.</p>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        const apiBaseUrl = window.location.origin;
        const serviceUrl = apiBaseUrl + "/api/reports";
        const viewerScriptUrl =
          serviceUrl + "/resources/js/telerikReportViewer";
        const reportStatusUrl =
          apiBaseUrl + "/api/accounting/receivings/report-status";
        const rrNo = String(
          new URLSearchParams(window.location.search).get("rr_no") || "",
        ).trim();

        function escapeHtml(value) {
          return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function showMessage(title, message, details) {
          document.getElementById("reportViewer").innerHTML =
            '<div class="viewer-message">' +
            "<h1>" +
            escapeHtml(title) +
            "</h1>" +
            "<p>" +
            escapeHtml(message) +
            "</p>" +
            (details ? "<code>" + escapeHtml(details) + "</code>" : "") +
            "</div>";
        }

        function loadViewerScript() {
          return new Promise(function (resolve, reject) {
            const script = document.createElement("script");
            script.src = viewerScriptUrl;
            script.async = false;
            script.onload = resolve;
            script.onerror = function () {
              reject(new Error("Unable to load " + viewerScriptUrl));
            };
            document.head.appendChild(script);
          });
        }

        function initializeViewer() {
          if (
            !window.jQuery ||
            !window.jQuery.fn ||
            typeof window.jQuery.fn.telerik_ReportViewer !== "function"
          ) {
            throw new Error("The Telerik HTML5 viewer plugin is unavailable.");
          }

          window.jQuery("#reportViewer").empty();
          window.jQuery("#reportViewer").telerik_ReportViewer({
            serviceUrl: serviceUrl,
            reportSource: {
              report: "ReceivingReport.trdp",
              parameters: { rr_no: rrNo },
            },
            viewMode: window.telerikReportViewer.ViewModes.INTERACTIVE,
            scaleMode: window.telerikReportViewer.ScaleModes.SPECIFIC,
            scale: 1,
            enableAccessibility: true,
            sendEmail: { enabled: false },
          });
        }

        if (!rrNo) {
          showMessage(
            "Receiving number is missing.",
            "No rr_no report parameter was supplied.",
          );
          return;
        }

        fetch(reportStatusUrl, { credentials: "same-origin" })
          .then(async function (response) {
            if (response.ok) {
              return;
            }

            const problem = await response.json().catch(function () {
              return {};
            });
            throw new Error(
              problem.detail ||
                "Reports/ReceivingReport.trdp is not installed on the API.",
            );
          })
          .then(loadViewerScript)
          .then(initializeViewer)
          .catch(function (error) {
            showMessage(
              "Receiving report is unavailable.",
              "The report viewer could not be initialized.",
              error.message,
            );
          });
      })();
    </script>
  </body>
</html>
